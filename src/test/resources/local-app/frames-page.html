<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frames Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 24px;
        }

        .frame-grid {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        iframe {
            width: 340px;
            height: 180px;
            border: 2px solid #2563eb;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Frames Demo</h1>

    <div class="frame-grid">
        <iframe id="first-frame" srcdoc="
            <html><body style='font-family:Arial; padding:16px;'><h2>First frame</h2>
            <input id='first-input' type='text' placeholder='first' />
            <button id='first-button' type='button'>First</button>
            <div id='first-status'>first-waiting</div>
            <script>
                document.getElementById('first-button').addEventListener('click', function () {
                    document.getElementById('first-status').textContent = 'first:' + document.getElementById('first-input').value;
                });
            </script>
            </body></html>
        "></iframe>

        <iframe id="second-frame" srcdoc="
            <html><body style='font-family:Arial; padding:16px;'><h2>Second frame</h2>
            <input id='second-input' type='text' placeholder='second' />
            <button id='second-button' type='button'>Second</button>
            <div id='second-status'>second-waiting</div>
            <script>
                document.getElementById('second-button').addEventListener('click', function () {
                    document.getElementById('second-status').textContent = 'second:' + document.getElementById('second-input').value;
                });
            </script>
            </body></html>
        "></iframe>
    </div>
</body>
</html>
