<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Window Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 32px;
        }

        .actions {
            display: flex;
            gap: 16px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>New Window Demo</h1>
    <p>Open a new tab or window.</p>

    <div class="actions">
        <a id="open-link-tab" href="new-window-target.html" target="_blank">Open linked page in new tab</a>
        <button id="open-window-button" type="button">Open JS window</button>
    </div>

    <script>
        document.getElementById('open-window-button').addEventListener('click', function () {
            window.open('new-window-target.html', '_blank');
        });
    </script>
</body>
</html>
