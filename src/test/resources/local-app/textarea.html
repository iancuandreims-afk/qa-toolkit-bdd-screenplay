<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Textarea Demo</title>
</head>
<body>
    <h1>Textarea Demo</h1>

    <label for="notes">Notes</label>
    <textarea id="notes" rows="4"></textarea>

    <label for="editor">Editable content</label>
    <div id="editor" contenteditable="true"></div>

    <label for="multiline-value">Multiline value</label>
    <textarea id="multiline-value" rows="4"></textarea>
</body>
</html>
