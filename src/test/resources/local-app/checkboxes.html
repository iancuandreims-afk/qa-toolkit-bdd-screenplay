<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkboxes Demo</title>
</head>
<body>
    <h1>Checkboxes Demo</h1>

    <label>
        <input id="default-checked" type="checkbox" checked />
        Default checked
    </label>

    <label>
        <input id="unchecked-box" type="checkbox" />
        Unchecked box
    </label>

    <fieldset>
        <legend>Radio group</legend>
        <label><input type="radio" name="choice" value="first" checked /> First</label>
        <label><input type="radio" name="choice" value="second" /> Second</label>
    </fieldset>

    <label>
        <input id="toggle-switch" type="checkbox" />
        Toggle switch
    </label>
</body>
</html>
