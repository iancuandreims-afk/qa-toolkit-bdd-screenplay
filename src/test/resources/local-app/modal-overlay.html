<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modal and Dropdown Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 32px;
        }

        .menu-wrap {
            position: relative;
            display: inline-block;
            margin-top: 24px;
        }

        #menu-panel {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 8px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
            min-width: 180px;
            padding: 8px;
            z-index: 2;
        }

        #menu-trigger:hover + #menu-panel,
        #menu-panel:hover {
            display: block;
        }

        #backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        #modal {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 12px;
            box-shadow: 0 20px 32px rgba(0, 0, 0, 0.25);
            padding: 20px;
            z-index: 3;
        }

        #modal.visible,
        #backdrop.visible {
            display: block;
        }

        #close-modal {
            margin-top: 14px;
        }
    </style>
</head>
<body>
    <h1>Modal and Dropdown Demo</h1>

    <button id="open-modal" type="button">Open modal</button>

    <div class="menu-wrap">
        <button id="menu-trigger" type="button">Account menu</button>
        <div id="menu-panel">
            <div>Profile</div>
            <div>Settings</div>
            <div>Logout</div>
        </div>
    </div>

    <div id="backdrop" aria-hidden="true"></div>

    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">Important notice</h2>
        <p>This action requires your confirmation.</p>
        <button id="close-modal" type="button">Close</button>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const backdrop = document.getElementById('backdrop');
        const openModalButton = document.getElementById('open-modal');
        const closeModalButton = document.getElementById('close-modal');

        function hideModal() {
            modal.classList.remove('visible');
            backdrop.classList.remove('visible');
        }

        openModalButton.addEventListener('click', function () {
            modal.classList.add('visible');
            backdrop.classList.add('visible');
        });

        closeModalButton.addEventListener('click', hideModal);
        backdrop.addEventListener('click', hideModal);
    </script>
</body>
</html>
