<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
</head>
<body>
    <h1 id="results-title">Search Results</h1>
    <p id="result-message">Results for: test</p>

    <div id="results-list">
        <div class="result-card" data-result="1">Result 1: test</div>
        <div class="result-card" data-result="2">Result 2: sample</div>
        <div class="result-card" data-result="3">Result 3: qa</div>
    </div>

    <div id="results-count">3</div>
    <div id="hidden-results" style="display:none;">
        <div class="hidden-card">Hidden result</div>
    </div>

    <input id="search-value" type="text" value="test" />
</body>
</html>
